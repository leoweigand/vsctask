[package]
name = "vsctask"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Run VS Code tasks.json tasks outside VS Code"
repository = "https://github.com/leoweigand/vsctask"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
jsonc-parser = { version = "0.33.1", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
